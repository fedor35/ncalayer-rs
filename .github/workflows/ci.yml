name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: System deps (Qt для Slint, NSS для certutil)
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev libnss3-tools libdbus-1-dev libgtk-3-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Тесты с оракулом Kalkan пропускаются сами: NCALayer на раннере нет.
      - run: cargo test --workspace
