[package]
name = "ncalayerd"
description = "Открытая замена NCALayer: wss-сервер 127.0.0.1:13579 для подписи ЭЦП НУЦ РК"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["ui-slint"]
# GUI на Slint (окна, трей, настройки); без него — kdialog/zenity.
ui-slint = ["dep:nca-ui-slint"]

[dependencies]
nca-protocol = { path = "../nca-protocol" }
nca-ui = { path = "../nca-ui" }
nca-ui-slint = { path = "../nca-ui-slint", optional = true }
kz-pki = { path = "../kz-pki" }
kz-cms = { path = "../kz-cms" }
kz-xmldsig = { path = "../kz-xmldsig" }
rand = "0.10"
base64 = "0.22"
async-trait = "0.1"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "process", "signal"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
futures-util = "0.3"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
x509-parser = "0.18"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
time = "0.3"

# cargo deb: `cargo install cargo-deb && cargo deb -p ncalayerd`
[package.metadata.deb]
name = "ncalayer-rs"
maintainer = "Fedor Gubenkov <cto@teplosmart.kz>"
copyright = "2026 Fedor Gubenkov"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = """Открытая замена NCALayer: локальный сервис wss://127.0.0.1:13579, через который
порталы госорганов Казахстана (egov.kz, salyk.kz, stat.gov.kz, knp.kgd.gov.kz) подписывают
документы ЭЦП НУЦ РК. Без Java. После установки: `ncalayerd install-ca` и перезапуск браузера."""
section = "utils"
priority = "optional"
depends = "$auto, libnss3-tools"
recommends = "kdialog | zenity"
assets = [
  ["target/release/ncalayerd", "usr/bin/", "755"],
  ["../../packaging/ncalayerd.service", "usr/lib/systemd/user/", "644"],
  ["../../packaging/ncalayerd.desktop", "usr/share/applications/", "644"],
  ["../../packaging/ncalayer-rs.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
  ["../../packaging/ncalayer-rs.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
  ["../../README.md", "usr/share/doc/ncalayer-rs/", "644"],
]
